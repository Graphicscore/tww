name: Build

on:
  push:
  pull_request:

# dropped: GitHub-only (permissions: block - Forgejo ignores it)

jobs:
  build:
    container: ghcr.io/zeldaret/tww-build:main

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [GZLE01, GZLP01, GZLJ01, D44J01]

    steps:
    # Checkout the repository
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    # Set Git config
    - name: Git config
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    # Normalize file mod times
    - name: Restore timestamps
      run: uv run https://raw.githubusercontent.com/MestreLion/git-tools/refs/tags/v2022.12/git-restore-mtime --merge --commit-time

    # Copy the original files to the workspace
    - name: Prepare
      run: cp -a /orig .

    # Restore cached files
    - name: Cache build
      uses: actions/cache@v4
      with:
        path: |
          build
          .ninja_deps
          .ninja_log
        key: ${{ runner.os }}-${{ matrix.version }}-${{ github.sha }}
        restore-keys: ${{ runner.os }}-${{ matrix.version }}-

    # Build the project
    - name: Build
      run: |
        python configure.py --map --version ${{ matrix.version }} \
            --binutils /binutils --compilers /compilers
        ninja all_source progress build/${{ matrix.version }}/report.json

    # Upload map files
    - name: Upload map
      uses: https://data.forgejo.org/forgejo/upload-artifact@v4
      with:
        name: ${{ matrix.version }}_maps
        path: build/${{ matrix.version }}/**/*.MAP

    # Upload progress report
    - name: Upload report
      uses: https://data.forgejo.org/forgejo/upload-artifact@v4
      with:
        name: ${{ matrix.version }}_report
        path: build/${{ matrix.version }}/report.json

  website:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout website code
      uses: actions/checkout@v4
      with:
        repository: LagoLunatic/tww-decomp-website
        github-server-url: https://github.com

    - name: Download artifact
      uses: https://data.forgejo.org/forgejo/download-artifact@v4
      with:
        name: GZLE01_report
        path: ./artifacts

    - name: Rename artifact
      run: |
        mv ./artifacts/report.json ./artifacts/progress.json

    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: "8.x.x"

    - name: Cache node modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    - name: Build Website
      run: |
        python build.py

    # dropped: GitHub-only (actions/upload-pages-artifact)
    # dropped: GitHub-only (actions/deploy-pages)
